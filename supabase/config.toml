# Supabase CLI config for CamRide. Generated values trimmed to what this project changes;
# everything else uses CLI defaults. Run `supabase init` docs: https://supabase.com/docs/guides/local-development/cli/config
project_id = "camride"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[auth]
enabled = true
site_url = "camride://"
additional_redirect_urls = ["camride://*"]
jwt_expiry = 3600
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Votre code CamRide / Your CamRide code: {{ .Code }}"
max_frequency = "60s"

# Local testing without an SMS provider: these numbers always receive the given OTP.
[auth.sms.test_otp]
237677000001 = "123456"
237699000002 = "123456"

# Production needs a real SMS provider (Twilio, MessageBird, Textlocal or Vonage) configured
# in the Supabase dashboard (Authentication > Providers > Phone). Do not commit credentials.
[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[edge_runtime]
enabled = true
policy = "per_worker"

# Payment providers call this endpoint without a Supabase JWT; it authenticates them by signature.
[functions.payments-webhook]
verify_jwt = false

[functions.request-ride]
verify_jwt = true

[functions.match-driver]
verify_jwt = true

[functions.create-order]
verify_jwt = true

[functions.payments-initiate]
verify_jwt = true
